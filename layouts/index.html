<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>brocademaple</title>
<style>
  /* HANDOFF NOTE FOR CODEX:
     Fonts below load from Google Fonts CDN. If this needs to work offline or
     reliably in mainland China, replace this @import with local @font-face
     declarations using self-hosted .woff2 files for:
       - Cormorant Garamond: 400, 500, italic 500, italic 600
       - Playfair Display: 600, 700, italic 500, italic 600
       - Inter: 400, 500, 600, 700
       - Noto Serif SC: 400, 500, 600, 700, 900 — this is now the ONLY
         Chinese font on the page (used for body text and headings alike,
         not just display headings). Full CJK charset is large — subset
         to only the characters actually used on the page, or use a
         dynamic-subsetting service, or first paint will be slow.
     Do not swap these fonts for different ones without checking with design —
     the italic-script vs. CJK-serif contrast is the visual signature of the page.
  */
  @import url('https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;1,500;1,600&family=Playfair+Display:ital,wght@0,600;0,700;1,500;1,600&family=Inter:wght@400;500;600;700&family=Noto+Serif+SC:wght@400;500;600;700;900&display=swap');

  :root{
    /* ---- 海蓝金 — Mediterranean noon, sun on water ---- */
    --bg-0:#04243f;
    --bg-1:#0a4f7a;
    --mist:#1f8fc4;
    --mist-soft:#0d6694;
    --gold:#e8b54a;
    --gold-bright:#ffe29a;
    --card:#fbf4e2;
    --card-2:#f3e6c8;
    --ink:#13202c;
    --ink-soft:#4c5d6b;
    --particle-a:255,206,107; /* warm gold dust rgb */
    --particle-b:255,255,255; /* sun-glitter white rgb */
    --particle-c:255,225,140; /* bright gold rgb */
    --accent-text:#bfe6ff;
    --sun-glow:#ffe9b0;
  }

  *{margin:0;padding:0;box-sizing:border-box;}
  html,body{
    background:var(--bg-0);
    color:var(--ink);
    font-family:'Noto Serif SC','Inter',serif;
    overflow-x:hidden;
    scroll-behavior:smooth;
  }
  body{
    background:
      radial-gradient(ellipse 60% 50% at 72% 6%, color-mix(in srgb, var(--sun-glow) 70%, transparent), transparent 60%),
      radial-gradient(ellipse 95% 70% at 50% 28%, color-mix(in srgb, var(--mist) 75%, transparent), transparent 78%),
      radial-gradient(ellipse 75% 55% at 15% 88%, color-mix(in srgb, var(--gold) 30%, transparent), transparent 72%),
      linear-gradient(165deg, var(--bg-1), var(--bg-0) 65%, var(--bg-0));
    transition: background 1.2s ease;
    min-height:100vh;
    position:relative;
  }
  /* soft sun wash over the sea-blue field; no hard stripe texture */
  body::before{
    content:'';
    position:fixed; inset:0;
    background:
      radial-gradient(ellipse 48% 60% at 69% 9%, color-mix(in srgb, var(--sun-glow) 24%, transparent), transparent 72%),
      linear-gradient(118deg, transparent 0%, color-mix(in srgb, var(--sun-glow) 10%, transparent) 44%, transparent 70%);
    opacity:.58;
    mix-blend-mode:soft-light;
    pointer-events:none;
    z-index:1;
    transition:background 1.2s ease;
  }

  canvas#field{
    position:fixed;
    inset:0;
    width:100%;
    height:100%;
    z-index:1;
    pointer-events:none;
  }

  .wrap{
    position:relative;
    z-index:2;
    max-width:1280px;
    margin:0 auto;
    padding:0 64px;
  }

  /* ---------- NAV ---------- */
  nav{
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:34px 0 0;
  }
  .brand{
    display:flex;
    align-items:center;
    gap:13px;
  }
  .brand-mark{
    width:42px;height:42px;
    border-radius:0;
    background:transparent;
    display:block;
    overflow:visible;
    filter:drop-shadow(0 4px 14px color-mix(in srgb, var(--gold) 42%, transparent));
  }
  .brand-mark img{
    width:100%;
    height:100%;
    display:block;
    object-fit:contain;
  }
  .brand-name{
    font-family:'Noto Serif SC',serif;
    font-size:15px;font-weight:700;letter-spacing:.03em;
    color:#e9eef3;
  }

  .nav-links{
    display:flex;
    align-items:center;
    gap:28px;
  }
  .nav-links a{
    font-family:'Noto Serif SC',serif;
    font-size:13.5px;
    font-weight:500;
    color:rgba(255,255,255,.65);
    text-decoration:none;
    transition:color .25s ease;
  }
  .nav-links a:hover{color:#fff;}
  .nav-links .nav-cta{
    padding:9px 20px;
    border-radius:100px;
    background:rgba(255,255,255,.08);
    border:1px solid rgba(255,255,255,.16);
    color:#fff;
  }
  .nav-links .nav-cta:hover{background:rgba(255,255,255,.14);}

  /* ---------- HERO ---------- */
  .hero{
    display:grid;
    grid-template-columns:.78fr 1.22fr;
    gap:48px;
    align-items:center;
    padding:78px 0 84px;
    min-height:82vh;
    scroll-margin-top:90px;
  }
  h1.title{
    font-family:'Noto Serif SC','Playfair Display',serif;
    font-weight:700;
    font-size:88px;
    line-height:1.0;
    letter-spacing:.01em;
    color:#f5f3ee;
    margin-bottom:30px;
  }
  h1.title em{
    font-style:normal;
    font-weight:700;
    background:linear-gradient(120deg, var(--gold-bright), var(--gold) 60%, var(--mist));
    -webkit-background-clip:text;
    background-clip:text;
    -webkit-text-fill-color:transparent;
  }

  .project-words{
    position:relative;
    min-height:560px;
    isolation:isolate;
  }
  .project-words::before{
    content:'';
    position:absolute;
    inset:8% 4% 10%;
    background:
      radial-gradient(ellipse 42% 48% at 58% 26%, color-mix(in srgb, var(--sun-glow) 18%, transparent), transparent 70%),
      radial-gradient(ellipse 70% 58% at 40% 68%, color-mix(in srgb, var(--mist) 20%, transparent), transparent 76%);
    opacity:.72;
    filter:blur(.2px);
    pointer-events:none;
    z-index:-1;
  }
  .proj-word{
    position:absolute;
    appearance:none;
    border:0;
    background:transparent;
    padding:0 0 10px;
    cursor:pointer;
    font-family:'Cormorant Garamond',serif;
    font-style:italic;
    font-weight:600;
    line-height:1.08;
    text-align:left;
    text-decoration:none;
    letter-spacing:0;
    background:linear-gradient(120deg, var(--gold-bright), var(--gold) 50%, var(--mist) 96%);
    -webkit-background-clip:text;
    background-clip:text;
    -webkit-text-fill-color:transparent;
    filter:drop-shadow(0 6px 24px rgba(0,0,0,.34));
    transition:transform .35s cubic-bezier(.2,.8,.2,1), filter .35s ease, opacity .35s ease;
  }
  .proj-word::after{
    content:'';
    position:absolute;
    left:.04em;
    bottom:1px;
    width:0;
    height:2px;
    border-radius:999px;
    background:linear-gradient(90deg, var(--gold-bright), transparent);
    opacity:.78;
    transition:width .35s ease;
  }
  .proj-word:hover,
  .proj-word:focus-visible{
    transform:translateY(-5px) scale(1.015);
    filter:drop-shadow(0 10px 28px rgba(0,0,0,.46));
    outline:none;
  }
  .proj-word:hover::after,
  .proj-word:focus-visible::after{ width:68%; }
  .proj-word:focus-visible{
    text-shadow:0 0 0 transparent;
  }
  .proj-word .word-no{
    display:block;
    margin-bottom:6px;
    font-family:'Inter',sans-serif;
    font-style:normal;
    font-size:11px;
    font-weight:700;
    letter-spacing:.16em;
    text-transform:uppercase;
    -webkit-text-fill-color:rgba(191,230,255,.68);
    color:rgba(191,230,255,.68);
  }
  .word-0{font-size:64px; left:0; top:7%;}
  .word-1{font-size:50px; left:31%; top:39%;}
  .word-2{font-size:49px; right:0; top:8%;}
  .word-3{font-size:52px; left:3%; top:69%;}
  .word-4{font-size:46px; right:6%; top:68%;}
  .word-2,
  .word-4{ text-align:right; }
  .word-1{ transform:rotate(-2deg); }
  .word-3{ transform:rotate(1.5deg); }
  .word-1:hover,
  .word-1:focus-visible{ transform:rotate(-2deg) translateY(-5px) scale(1.015); }
  .word-3:hover,
  .word-3:focus-visible{ transform:rotate(1.5deg) translateY(-5px) scale(1.015); }

  @media (max-width:900px){
    .hero{
      grid-template-columns:1fr;
      padding-top:50px;
      min-height:auto;
    }
    .project-words{
      min-height:auto;
      display:grid;
      grid-template-columns:1fr;
      gap:28px;
      padding:12px 0 8px;
    }
    .project-words::before{ inset:0; }
    .proj-word{
      position:relative;
      left:auto; right:auto; top:auto;
      font-size:clamp(42px, 12vw, 66px);
      text-align:left;
      transform:none;
    }
    .word-1,
    .word-2,
    .word-3,
    .word-4{ transform:none; text-align:left; }
    .word-1:hover,
    .word-1:focus-visible,
    .word-3:hover,
    .word-3:focus-visible{ transform:translateY(-5px) scale(1.015); }
  }

  /* ---------- PROJECT DETAIL MODAL ---------- */
  .modal-backdrop{
    position:fixed; inset:0;
    background:
      radial-gradient(ellipse 54% 62% at 64% 10%, color-mix(in srgb, var(--sun-glow) 18%, transparent), transparent 72%),
      rgba(2,18,32,.74);
    backdrop-filter:blur(12px) saturate(1.08);
    display:flex;
    align-items:center;
    justify-content:center;
    padding:24px;
    z-index:100;
    opacity:0;
    visibility:hidden;
    pointer-events:none;
    transition:opacity .3s ease, visibility .3s ease;
  }
  .modal-backdrop.is-open{
    opacity:1;
    visibility:visible;
    pointer-events:auto;
  }
  .modal-panel{
    position:relative;
    width:100%;
    max-width:680px;
    max-height:85vh;
    overflow-y:auto;
    border-radius:22px;
    background:
      radial-gradient(ellipse 64% 58% at 78% 0%, color-mix(in srgb, var(--sun-glow) 20%, transparent), transparent 70%),
      radial-gradient(ellipse 75% 70% at 8% 92%, color-mix(in srgb, var(--mist) 26%, transparent), transparent 76%),
      linear-gradient(150deg, rgba(5,52,84,.88), rgba(7,78,118,.78) 52%, rgba(3,29,52,.92));
    border:1px solid color-mix(in srgb, var(--gold-bright) 36%, rgba(255,255,255,.12));
    box-shadow:
      0 40px 100px -22px rgba(0,0,0,.72),
      0 0 70px -18px color-mix(in srgb, var(--gold) 42%, transparent),
      inset 0 1px 0 rgba(255,255,255,.18);
    transform:scale(.94) translateY(10px);
    transition:transform .35s cubic-bezier(.2,.8,.2,1);
  }
  .modal-backdrop.is-open .modal-panel{
    transform:scale(1) translateY(0);
  }
  .modal-close{
    position:absolute;
    top:16px; right:16px;
    width:32px; height:32px;
    border-radius:50%;
    border:none;
    cursor:pointer;
    background:rgba(255,255,255,.1);
    color:#fdf7e8;
    display:flex; align-items:center; justify-content:center;
    z-index:2;
    transition:background .25s ease;
  }
  .modal-close:hover{ background:rgba(255,255,255,.18); }
  .modal-image{
    position:relative;
    aspect-ratio:16/5.6;
    border-radius:20px 20px 0 0;
    background:
      radial-gradient(ellipse 52% 70% at 70% 12%, color-mix(in srgb, var(--gold-bright) 32%, transparent), transparent 72%),
      radial-gradient(ellipse 68% 60% at 18% 82%, color-mix(in srgb, var(--mist) 35%, transparent), transparent 74%),
      linear-gradient(150deg, rgba(10,79,122,.66), rgba(31,143,196,.34) 56%, rgba(4,36,63,.22));
    display:flex;
    align-items:flex-end;
    justify-content:flex-start;
    text-align:left;
    padding:28px 32px;
    border-bottom:1px solid rgba(255,255,255,.12);
    overflow:hidden;
  }
  .modal-image img{
    position:absolute;
    inset:0;
    width:100%;
    height:100%;
    object-fit:cover;
    display:block;
  }
  .modal-image::after{
    content:'';
    position:absolute;
    inset:0;
    background:
      linear-gradient(180deg, rgba(2,18,32,.02), rgba(2,18,32,.18)),
      radial-gradient(ellipse 48% 80% at 80% 0%, rgba(255,226,154,.18), transparent 70%);
    pointer-events:none;
  }
  .modal-image span{
    position:relative;
    z-index:1;
    font-family:'Noto Serif SC',serif;
    font-size:13px;
    font-weight:500;
    letter-spacing:.04em;
    color:rgba(255,255,255,.62);
    border:1px solid rgba(255,255,255,.18);
    border-radius:100px;
    background:rgba(255,255,255,.06);
    padding:8px 18px;
  }
  .modal-body{ padding:30px 32px 32px; }
  .modal-meta{
    display:flex; align-items:center; gap:12px;
    margin-bottom:10px;
  }
  .modal-catalog{
    font-family:'Inter',sans-serif;
    font-size:11px; font-weight:700; letter-spacing:.12em;
    color:var(--gold-bright);
  }
  .modal-tag{
    font-family:'Inter',sans-serif;
    font-size:11px; font-weight:600; letter-spacing:.06em;
    text-transform:uppercase;
    color:rgba(191,230,255,.72);
  }
  .modal-title{
    font-family:'Cormorant Garamond',serif;
    font-style:italic;
    font-weight:600;
    font-size:42px;
    line-height:1.1;
    background:linear-gradient(120deg, var(--gold-bright), var(--gold) 52%, var(--mist));
    -webkit-background-clip:text;
    background-clip:text;
    -webkit-text-fill-color:transparent;
    margin-bottom:14px;
  }
  .modal-desc{
    font-family:'Noto Serif SC',serif;
    font-size:14.5px;
    line-height:1.8;
    color:rgba(244,249,252,.78);
    margin-bottom:26px;
  }
  .modal-actions{ display:flex; gap:12px; flex-wrap:wrap; }
  .modal-btn{
    font-family:'Noto Serif SC',serif;
    font-size:13.5px;
    font-weight:600;
    padding:11px 22px;
    border-radius:100px;
    text-decoration:none;
    display:inline-flex;
    align-items:center;
    transition:all .25s ease;
  }
  .modal-btn-primary{
    background:linear-gradient(135deg, var(--gold-bright), var(--gold));
    color:#08253f;
    box-shadow:0 10px 22px color-mix(in srgb, var(--gold) 34%, transparent);
  }
  .modal-btn-primary:hover{ transform:translateY(-2px); }
  .modal-btn-disabled{
    background:rgba(255,255,255,.08);
    color:rgba(244,249,252,.62);
    border:1px solid rgba(255,255,255,.12);
    cursor:default;
  }
  .modal-btn-secondary{
    background:rgba(255,255,255,.08);
    color:#fdf7e8;
    border:1px solid rgba(255,255,255,.14);
  }
  .modal-btn-secondary:hover{ background:rgba(255,255,255,.14); }

  @media (max-width:560px){
    .modal-body{ padding:24px 22px 26px; }
    .modal-title{ font-size:34px; }
  }

  footer{
    padding:40px 0 60px;
    text-align:center;
    font-family:'Noto Serif SC',serif;
    font-size:12.5px;
    color:rgba(255,255,255,.3);
  }

  @media (max-width: 900px){
    .wrap{padding:0 24px;}
    h1.title{font-size:52px;}
    nav{padding-top:24px;}
  }

  @media (prefers-reduced-motion: reduce){
    canvas#field{display:none;}
    *{transition-duration:.01ms !important;}
  }
</style>
</head>
<body>

<canvas id="field"></canvas>

<div class="wrap">

  <nav>
    <div class="brand">
      <div class="brand-mark"><img src="/assets/brocademaple-maple-mark.png" alt="brocademaple maple mark"></div>
      <div class="brand-name">brocademaple</div>
    </div>
    <div class="nav-links">
      <a href="/gallery/">Gallery</a>
      <a href="#projects" class="nav-cta">Projects</a>
    </div>
  </nav>

  <section class="hero" id="projects">
    <div>
      <h1 class="title">brocade<br><em>maple</em></h1>
    </div>
    <div class="project-words" id="projectGrid" aria-label="作品项目入口"></div>
  </section>

  <footer>© 2026 brocademaple · built one prototype at a time</footer>

</div>

<!-- ===================== Project detail modal ===================== -->
<div class="modal-backdrop" id="modalBackdrop">
  <div class="modal-panel" id="modalPanel" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
    <button class="modal-close" id="modalClose" type="button" aria-label="关闭">
      <svg width="15" height="15" viewBox="0 0 15 15" fill="none"><path d="M2.5 2.5l10 10M12.5 2.5l-10 10" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
    </button>
    <div class="modal-image" id="modalImage"></div>
    <div class="modal-body">
      <div class="modal-meta">
        <span class="modal-catalog" id="modalCatalog"></span>
        <span class="modal-tag" id="modalTag"></span>
      </div>
      <h3 class="modal-title" id="modalTitle"></h3>
      <p class="modal-desc" id="modalDesc"></p>
      <div class="modal-actions">
        <a class="modal-btn modal-btn-primary" id="modalGithub" href="#" target="_blank" rel="noopener">在 GitHub 查看 →</a>
        <div id="modalDemoSlot"></div>
      </div>
    </div>
  </div>
</div>

<script>
/* ===================== Project data + index/modal rendering =====================

   drift apart. `demo: null` means no public preview link exists yet; the
   modal shows an honest "待补充" label instead of a fake link. `image`
   points at local screenshots captured from each project's public page or repo.
================================================================================ */

  {

  },
];

function renderProjectCards(){
  const grid = document.getElementById('projectGrid');
  grid.innerHTML = PROJECTS.map((p, i) => `
    <button class="proj-word word-${i}" type="button" id="proj-${p.id}" data-index="${i}" aria-label="打开 ${p.title.replace('\n',' ')} 项目详情">
      <span class="word-no">No. ${p.no} / ${p.status}</span>
      <span>${p.title.split('\n').join('<br>')}</span>
    </button>
  `).join('');
}
renderProjectCards();

/* ---- Modal ---- */
(function(){
  const backdrop   = document.getElementById('modalBackdrop');
  const closeBtn   = document.getElementById('modalClose');
  const elImage    = document.getElementById('modalImage');
  const elCatalog  = document.getElementById('modalCatalog');
  const elTag      = document.getElementById('modalTag');
  const elTitle    = document.getElementById('modalTitle');
  const elDesc     = document.getElementById('modalDesc');
  const elGithub   = document.getElementById('modalGithub');
  const elDemoSlot = document.getElementById('modalDemoSlot');

  let lastFocused = null;

  function openModal(project){
    elCatalog.textContent = `No. ${project.no} / ${project.status}`;
    elTag.textContent = project.tag;
    elTitle.innerHTML = project.title.split('\n').join('<br>');
    elDesc.textContent = project.longDesc || project.desc;
    elGithub.href = project.github;
    if(project.image){
      elImage.innerHTML = `<img src="${project.image}" alt="${project.title.replace('\n',' ')} 项目截图" loading="lazy">`;
    } else {
      elImage.innerHTML = `<span>封面图占位 · ${project.title.replace('\n',' ')}</span>`;
    }

    if(project.demo){
      elDemoSlot.innerHTML = `<a class="modal-btn modal-btn-secondary" href="${project.demo}" target="_blank" rel="noopener">查看展示页 →</a>`;
    } else {
      elDemoSlot.innerHTML = `<span class="modal-btn modal-btn-disabled">展示页待补充</span>`;
    }

    lastFocused = document.activeElement;
    backdrop.classList.add('is-open');
    document.body.style.overflow = 'hidden';
    closeBtn.focus();
  }

  function closeModal(){
    backdrop.classList.remove('is-open');
    document.body.style.overflow = '';
    if(lastFocused && typeof lastFocused.focus === 'function') lastFocused.focus();
  }

  document.getElementById('projectGrid').addEventListener('click', (e) => {
    const word = e.target.closest('.proj-word');
    if(!word) return;
    const idx = parseInt(word.dataset.index, 10);
    if(PROJECTS[idx]) openModal(PROJECTS[idx]);
  });

  closeBtn.addEventListener('click', closeModal);
  backdrop.addEventListener('click', (e) => {
    if(e.target === backdrop) closeModal();
  });
  window.addEventListener('keydown', (e) => {
    if(e.key === 'Escape' && backdrop.classList.contains('is-open')) closeModal();
  });
})();
</script>

<script>
/* ===================== Particle field =====================
   GOLD-DUST RIBBON — particles cluster along a hooked S-shaped path (a
   multi-waypoint spline, not a single bulge): rises from the lower-left,
   arcs up and over the top, loops down near the right edge, then sweeps
   back left underneath — matching a hand-drawn reference path. Density
   falls off sharply perpendicular to the path. A handful of sparse
   stragglers wander the empty regions. Dominant shape is a faceted diamond
   chip (not thin lines), echoing the angular metal-flake look in the
   reference photo this was modeled on. A one-time converge -> burst ->
   reform plays on load.
=============================================================== */
(function(){
  const canvas = document.getElementById('field');
  const ctx = canvas.getContext('2d');
  let W, H, DPR;

  function resize(){
    DPR = Math.min(window.devicePixelRatio || 1, 1.5);
    W = canvas.width = window.innerWidth * DPR;
    H = canvas.height = window.innerHeight * DPR;
    canvas.style.width = window.innerWidth + 'px';
    canvas.style.height = window.innerHeight + 'px';
  }
  resize();
  window.addEventListener('resize', resize);

  const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  const isSmall = window.innerWidth < 800;

  function rand(a,b){ return a + Math.random()*(b-a); }
  function gaussianish(){
    // sum of uniforms approximates a normal distribution, cheap and good enough
    return (Math.random()+Math.random()+Math.random()-1.5)/1.5;
  }

  function colorTuple(){
    const root = getComputedStyle(document.body);
    const a = root.getPropertyValue('--particle-a').trim();
    const b = root.getPropertyValue('--particle-b').trim();
    const c = root.getPropertyValue('--particle-c').trim();
    return [a,b,c];
  }
  let palette = colorTuple();

  // ---- The ribbon path: a large flattened oval loop tilted lower-left to
  // upper-right. Particles flow steadily clockwise around it (verified:
  // screen-angle measured clockwise from 3 o'clock increases monotonically
  // as t increases, since canvas y is flipped relative to math convention).
  // No size pulsing — just smooth, constant circular flow. An ellipse is
  // naturally closed and never crosses itself, so there's no density
  // pile-up anywhere along it; t wraps seamlessly since the curve connects
  // back to itself exactly. ----
  const LOOP_CENTER = {x: 0.55, y: 0.38};
  const LOOP_RADIUS = {x: 0.52, y: 0.30}; // wide, flattened, before rotation
  const LOOP_ROTATION = -32 * Math.PI / 180; // tilts the long axis lower-left -> upper-right
  const LOOP_ROT_COS = Math.cos(LOOP_ROTATION);
  const LOOP_ROT_SIN = Math.sin(LOOP_ROTATION);

  function loopPoint(t){
    const a = t * Math.PI * 2;
    const ex = Math.cos(a) * LOOP_RADIUS.x;
    const ey = Math.sin(a) * LOOP_RADIUS.y;
    const wx = ex * LOOP_ROT_COS - ey * LOOP_ROT_SIN;
    const wy = ex * LOOP_ROT_SIN + ey * LOOP_ROT_COS;
    return {
      x: (LOOP_CENTER.x + wx) * W,
      y: (LOOP_CENTER.y + wy) * H,
    };
  }
  function loopTangent(t){
    const a = t * Math.PI * 2;
    const dex = -Math.sin(a) * LOOP_RADIUS.x;
    const dey =  Math.cos(a) * LOOP_RADIUS.y;
    const dx = dex * LOOP_ROT_COS - dey * LOOP_ROT_SIN;
    const dy = dex * LOOP_ROT_SIN + dey * LOOP_ROT_COS;
    const len = Math.hypot(dx,dy) || 1;
    return {x: dx/len, y: dy/len};
  }

  const RIBBON_COUNT = isSmall ? 460 : 860;
  const STRAY_COUNT  = isSmall ? 44  : 92;

  class Particle{
    constructor(isStray){ this.isStray = !!isStray; this.reset(true); }
    reset(initial){
      if(this.isStray){
        // sparse ambient particles scattered anywhere — matches the faint
        // stragglers visible in the empty regions of the reference image
        this.x = rand(0, W);
        this.y = rand(0, H);
        this.t = null;
      } else {
        this.t = Math.random(); // position around the loop, 0..1, wraps seamlessly
        const pt = loopPoint(this.t);
        const tan = loopTangent(this.t);
        const perp = {x: -tan.y, y: tan.x};
        // Density falls off perpendicular to the curve via a gaussian-ish spread.
        // Wider spread + flatter falloff = a thick cloud-band rather than a thin line.
        const spread = (Math.min(W,H)) * 0.24;
        this.perpOffset = gaussianish() * spread;
        this.x = pt.x + perp.x * this.perpOffset;
        this.y = pt.y + perp.y * this.perpOffset;
        this.perpUnit = perp;
        this.tanUnit = tan;
      }
      const r = Math.random();
      this.type = r < 0.55 ? 'chip' : (r < 0.8 ? 'glint' : 'dust');
      // size: most chips small, a few large bright ones near the curve center for that "scattered gemstone" look
      const closeness = this.isStray ? 0 : Math.max(0, 1 - Math.abs(this.perpOffset)/(Math.min(W,H)*0.24));
      this.depth = this.isStray ? rand(0.2,0.5) : rand(0.4, 0.9) + closeness*rand(0.3,0.9);
      const sizeBase = this.type === 'chip' ? rand(5,14) : this.type === 'glint' ? rand(1.6,3.4) : rand(2,4);
      this.len = sizeBase * DPR * this.depth;
      this.angle = rand(0, Math.PI*2);
      this.spin = rand(-0.01, 0.01);
      this.baseAlpha = this.isStray ? rand(0.12,0.30) : (rand(0.45,1.0) * (0.4 + closeness*0.6));
      this.twinklePhase = rand(0, Math.PI*2);
      this.twinkleSpeed = rand(0.0015, 0.0045);
      this.colorIdx = Math.floor(rand(0,3));
      this.driftSpeed = this.isStray ? rand(0.04,0.12) : rand(0.00095, 0.00132);
      this.scatter = 0; this.scatterVX = 0; this.scatterVY = 0;
      this.strayVX = this.isStray ? rand(-0.12,0.12)*DPR : 0;
      this.strayVY = this.isStray ? rand(-0.18,-0.04)*DPR : 0;
    }
    burst(){
      const cx = W/2, cy = H*0.38;
      const dx = this.x - cx, dy = this.y - cy;
      const dist = Math.max(Math.hypot(dx,dy), 1);
      const force = rand(3.5, 8.5) * DPR;
      this.scatterVX = (dx/dist) * force;
      this.scatterVY = (dy/dist) * force;
      this.scatter = 1;
    }
    update(t, frameScale = 1){
      if(this.scatter > 0){
        this.x += this.scatterVX * frameScale;
        this.y += this.scatterVY * frameScale;
        this.scatterVX *= Math.pow(0.94, frameScale);
        this.scatterVY *= Math.pow(0.94, frameScale);
        this.scatter *= Math.pow(0.96, frameScale);
        if(this.scatter < 0.02) this.scatter = 0;
      } else if(this.isStray){
        this.x += this.strayVX * frameScale;
        this.y += this.strayVY * frameScale;
        if(this.x<-20||this.x>W+20||this.y<-20||this.y>H+20) this.reset(false);
      } else {
        // travel slowly clockwise around the loop — wraps with modulo since
        // the ellipse connects back to itself with no seam or jump
        this.t = (this.t + this.driftSpeed * frameScale) % 1;
        const pt = loopPoint(this.t);
        const tan = loopTangent(this.t);
        const perp = {x: -tan.y, y: tan.x};
        // gentle perpendicular wobble so it doesn't look laser-straight
        const wobble = Math.sin(t*0.0006 + this.twinklePhase) * 3 * DPR;
        this.x = pt.x + perp.x * (this.perpOffset + wobble);
        this.y = pt.y + perp.y * (this.perpOffset + wobble);
      }
      this.angle += this.spin * frameScale;
      this.twinkle = 0.6 + 0.4 * Math.sin(t*this.twinkleSpeed + this.twinklePhase);
    }
    draw(ctx, palette){
      const rgb = palette[this.colorIdx];
      const alpha = this.baseAlpha * this.twinkle * (this.scatter > 0 ? Math.max(0.15, 1 - this.scatter*0.3) : 1);
      const useGlow = this.depth > 1.08;
      ctx.save();
      ctx.translate(this.x, this.y);
      ctx.rotate(this.angle);
      ctx.globalAlpha = Math.min(1, alpha);
      if(this.type === 'chip'){
        // faceted diamond chip — the dominant shape in the reference image
        if(useGlow){ ctx.shadowColor = `rgba(${rgb},0.7)`; ctx.shadowBlur = 5 * DPR; }
        const h = this.len, w = this.len * 0.46;
        const grad = ctx.createLinearGradient(0,-h/2,0,h/2);
        grad.addColorStop(0, `rgba(${rgb},1)`);
        grad.addColorStop(0.5, `rgba(${rgb},0.55)`);
        grad.addColorStop(1, `rgba(${rgb},0.9)`);
        ctx.fillStyle = grad;
        ctx.beginPath();
        ctx.moveTo(0,-h/2);
        ctx.lineTo(w/2,0);
        ctx.lineTo(0,h/2);
        ctx.lineTo(-w/2,0);
        ctx.closePath();
        ctx.fill();
      } else if(this.type === 'glint'){
        if(useGlow){ ctx.shadowColor = `rgba(${rgb},1)`; ctx.shadowBlur = 9 * DPR * this.depth; }
        ctx.fillStyle = `rgba(${rgb},1)`;
        ctx.beginPath();
        ctx.arc(0,0,this.len/2,0,Math.PI*2);
        ctx.fill();
      } else {
        ctx.fillStyle = `rgba(${rgb},0.9)`;
        ctx.beginPath();
        ctx.arc(0,0,this.len/2,0,Math.PI*2);
        ctx.fill();
      }
      ctx.restore();
    }
  }

  const particles = [];
  for(let i=0;i<RIBBON_COUNT;i++) particles.push(new Particle(false));
  for(let i=0;i<STRAY_COUNT;i++) particles.push(new Particle(true));

  function triggerBurst(){
    palette = colorTuple();
    particles.forEach(p => p.burst());
  }
  window.__triggerParticleBurst = triggerBurst;

  let lastFrameTime = performance.now();
  function loop(t){
    const dt = Math.min(40, Math.max(8, t - lastFrameTime || 16.67));
    const frameScale = dt / 16.67;
    lastFrameTime = t;
    ctx.clearRect(0,0,W,H);
    for(const p of particles){
      p.update(t, frameScale);
      p.draw(ctx, palette);
    }
    requestAnimationFrame(loop);
  }
  if(!reduceMotion) requestAnimationFrame(loop);

  setTimeout(()=>{ palette = colorTuple(); }, 50);
})();

/* ===================== Entrance sequence ===================== */
(function(){
  // Particles converge toward center then burst outward on load — the page's opening gesture.
  window.addEventListener('load', () => {
    setTimeout(() => {
      if(window.__triggerParticleBurst) window.__triggerParticleBurst();
    }, 350);
  });
})();

/* ===================== Floating project word entrance ===================== */
(function(){
  const words = document.querySelectorAll('.proj-word');
  words.forEach((word,i) => {
    word.style.opacity = 0;
    setTimeout(()=>{
      word.style.transition = 'opacity .7s ease';
      word.style.opacity = 1;
    }, 120 + i*70);
  });
})();
</script>

</body>
