<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AIGC Art Gallery | brocademaple</title>
<link rel="icon" href="/assets/brocademaple-maple-mark.png">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;1,500;1,600&family=Noto+Sans+SC:wght@400;500;600;700&family=Noto+Serif+SC:wght@400;500;600;700;900&display=swap');

  :root{
    --bg-0:#04243f;
    --bg-1:#0a4f7a;
    --mist:#1f8fc4;
    --gold:#e8b54a;
    --gold-bright:#ffe29a;
    --ink:#f5f3ee;
    --ink-soft:rgba(244,249,252,.74);
    --ink-dim:rgba(244,249,252,.52);
    --glass:rgba(255,255,255,.08);
    --line:rgba(255,226,154,.24);
    --shadow:rgba(0,0,0,.34);
    --particle-a:255,206,107;
    --particle-b:255,255,255;
    --particle-c:255,225,140;
    --sans:'Noto Sans SC','Noto Sans Simplified Chinese','PingFang SC','Helvetica Neue',Arial,sans-serif;
  }

  *{box-sizing:border-box;}
  html{scroll-behavior:smooth;}
  body{
    min-height:100vh;
    margin:0;
    color:var(--ink);
    background:
      radial-gradient(ellipse 58% 48% at 74% 2%, rgba(255,226,154,.34), transparent 64%),
      radial-gradient(ellipse 88% 62% at 48% 22%, rgba(31,143,196,.74), transparent 76%),
      linear-gradient(162deg, var(--bg-1), var(--bg-0) 66%, #031a2f);
    font-family:var(--sans);
    overflow-x:hidden;
  }

  body::before{
    content:'';
    position:fixed;
    inset:0;
    pointer-events:none;
    background:
      linear-gradient(118deg, transparent, rgba(255,226,154,.1) 46%, transparent 70%),
      radial-gradient(ellipse 38% 44% at 78% 8%, rgba(255,245,207,.22), transparent 72%);
    mix-blend-mode:soft-light;
    opacity:.72;
  }

  #galleryField{
    position:fixed;
    inset:0;
    width:100%;
    height:100%;
    z-index:0;
    pointer-events:none;
    opacity:.72;
  }

  .page{
    position:relative;
    z-index:1;
    width:100%;
    min-height:100vh;
    margin:0;
    padding:0;
  }

  .topbar{
    position:fixed;
    z-index:12;
    top:28px;
    left:clamp(18px, 4vw, 58px);
    right:clamp(18px, 4vw, 58px);
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:24px;
    pointer-events:none;
  }

  .brand{
    display:flex;
    align-items:center;
    gap:13px;
    color:#eef4f7;
    text-decoration:none;
    min-width:0;
    pointer-events:auto;
  }

  .brand img{
    width:42px;
    height:42px;
    filter:drop-shadow(0 4px 14px rgba(232,181,74,.36));
    flex:0 0 auto;
  }

  .brand span{
    font-family:'Noto Serif SC',serif;
    font-size:17px;
    font-weight:700;
    letter-spacing:.03em;
    overflow:hidden;
    text-overflow:ellipsis;
  }

  .nav-links{
    display:flex;
    align-items:center;
    gap:28px;
    flex:0 0 auto;
    pointer-events:auto;
  }

  .nav-links a{
    color:rgba(255,255,255,.65);
    font-family:var(--sans);
    font-size:13.5px;
    font-weight:500;
    text-decoration:none;
    transition:color .25s ease, background .25s ease;
  }

  .nav-links a:hover{color:#fff;}

  .nav-links .nav-cta{
    padding:9px 20px;
    border-radius:100px;
    background:rgba(255,255,255,.08);
    border:1px solid rgba(255,255,255,.16);
    color:#fff;
  }

  .nav-links .nav-cta:hover{background:rgba(255,255,255,.14);}

  .room-jump button,
  .tool-button,
  .filter-bar button{
    appearance:none;
    border:0;
    border-bottom:1px solid rgba(255,255,255,.28);
    border-radius:0;
    background:transparent;
    color:rgba(255,255,255,.8);
    font:600 13px/1.2 var(--sans);
    text-decoration:none;
    cursor:pointer;
    transition:border-color .2s ease, color .2s ease, opacity .2s ease;
  }

  .room-jump button:hover,
  .tool-button:hover,
  .filter-bar button:hover{
    color:#fff;
    border-color:rgba(255,226,154,.72);
  }

  .gallery-stage{
    position:relative;
    min-height:100svh;
    overflow:hidden;
  }

  .experience{
    position:absolute;
    inset:0;
    min-width:0;
    min-height:100%;
    border:0;
    border-radius:0;
    background:
      radial-gradient(ellipse 64% 52% at 84% 8%, rgba(255,226,154,.18), transparent 72%),
      linear-gradient(180deg, rgba(10,79,122,.76), rgba(4,36,63,.42) 56%, rgba(2,21,38,.7));
    box-shadow:none;
    overflow:hidden;
  }

  .scene-toolbar{
    position:absolute;
    z-index:4;
    top:112px;
    left:clamp(18px, 4vw, 58px);
    right:clamp(18px, 4vw, 58px);
    display:flex;
    justify-content:space-between;
    align-items:flex-start;
    gap:40px;
    pointer-events:none;
  }

  .museum-hud{
    width:min(340px, 42vw);
    color:rgba(255,255,255,.76);
    font-family:var(--sans);
    pointer-events:auto;
  }

  .hud-kicker{
    display:flex;
    align-items:center;
    gap:12px;
    margin-bottom:8px;
    color:var(--gold-bright);
    font-size:11px;
    font-weight:600;
    text-transform:uppercase;
  }

  .hud-kicker::after{
    content:'';
    height:1px;
    flex:1;
    background:linear-gradient(90deg, rgba(255,226,154,.72), transparent);
  }

  .hud-title{
    margin:0;
    color:#fff;
    font:600 clamp(17px, 1.7vw, 23px)/1.3 var(--sans);
  }

  .hud-copy{
    margin:7px 0 0;
    color:rgba(255,255,255,.55);
    font:400 12px/1.6 var(--sans);
  }

  .hud-actions{
    display:flex;
    gap:18px;
    margin-top:14px;
  }

  .hud-actions button,
  .archive-link{
    padding:0 0 6px;
    border:0;
    border-bottom:1px solid rgba(255,255,255,.3);
    border-radius:0;
    background:transparent;
    color:rgba(255,255,255,.74);
    font:500 12px/1.2 var(--sans);
    cursor:pointer;
  }

  .hud-actions button:hover,
  .archive-link:hover{
    color:#fff;
    border-color:var(--gold-bright);
  }

  .room-jump{
    display:flex;
    flex-direction:column;
    justify-content:flex-end;
    align-items:flex-end;
    gap:0;
    width:min(280px, 34vw);
    max-width:280px;
    pointer-events:auto;
  }

  .room-jump button{
    display:grid;
    grid-template-columns:30px minmax(92px, 1fr) 30px;
    align-items:center;
    width:100%;
    min-height:39px;
    padding:10px 0 8px;
    text-align:left;
    font-weight:500;
    letter-spacing:0;
  }

  .room-jump .nav-index,
  .room-jump .nav-count{
    color:rgba(255,255,255,.38);
    font-size:10px;
  }

  .room-jump .nav-label{text-align:left;}
  .room-jump .nav-count{text-align:right;}

  .room-jump button.is-active .nav-index,
  .room-jump button.is-active .nav-count{
    color:rgba(255,226,154,.7);
  }

  .room-jump button.is-active,
  .filter-bar button.is-active{
    color:var(--gold-bright);
    border-color:var(--gold-bright);
    background:transparent;
  }

  .scene-status{
    position:absolute;
    z-index:4;
    left:clamp(18px, 4vw, 58px);
    right:clamp(18px, 4vw, 58px);
    bottom:28px;
    display:flex;
    align-items:flex-end;
    justify-content:space-between;
    gap:24px;
    pointer-events:none;
  }

  .current-place{
    color:rgba(255,255,255,.7);
    font:500 11px/1.5 var(--sans);
    pointer-events:auto;
  }

  .current-place strong{
    display:block;
    color:#fff;
    font-size:13px;
    font-weight:600;
  }

  .archive-link{pointer-events:auto;}

  .scene-mount{
    position:absolute;
    inset:0;
    z-index:1;
    background:
      radial-gradient(ellipse 80% 56% at 48% 46%, rgba(31,143,196,.26), transparent 76%),
      linear-gradient(180deg, rgba(13,90,133,.34), rgba(3,30,52,.48));
  }

  .scene-mount canvas{
    display:block;
    width:100%;
    height:100%;
    cursor:grab;
  }

  .scene-mount canvas:active{cursor:grabbing;}

  .scene-fallback{
    position:absolute;
    inset:0;
    display:none;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    gap:14px;
    padding:30px;
    text-align:center;
    color:var(--ink-soft);
    background:rgba(3,24,42,.78);
    z-index:2;
  }

  .is-fallback .scene-fallback{display:flex;}

  .catalog{
    position:relative;
    z-index:2;
    width:min(1280px, calc(100% - 48px));
    margin:0 auto;
    padding:52px 0 76px;
  }

  .catalog-head{
    display:flex;
    align-items:start;
    justify-content:space-between;
    gap:20px;
    margin-bottom:18px;
  }

  .catalog h2{
    margin:0;
    font:600 clamp(32px, 4vw, 54px)/1 'Cormorant Garamond',serif;
    color:var(--gold-bright);
  }

  .catalog p{
    margin:8px 0 0;
    color:var(--ink-dim);
    font:500 13px/1.7 var(--sans);
    line-height:1.7;
  }

  .filter-bar{
    display:flex;
    flex-direction:column;
    flex-wrap:wrap;
    justify-content:flex-end;
    align-items:flex-end;
    gap:0;
    min-width:180px;
  }

  .filter-bar button{
    min-height:32px;
    min-width:120px;
    padding:8px 0 7px;
    text-align:right;
  }

  .catalog-grid{
    display:grid;
    grid-template-columns:repeat(auto-fill, minmax(150px, 1fr));
    gap:14px;
  }

  .art-card{
    display:block;
    width:100%;
    padding:0;
    overflow:hidden;
    text-align:left;
    border:1px solid rgba(255,226,154,.18);
    border-radius:8px;
    background:rgba(3,24,42,.38);
    color:inherit;
    cursor:pointer;
  }

  .art-card img{
    display:block;
    width:100%;
    aspect-ratio:4 / 5;
    object-fit:cover;
    background:#041d32;
  }

  .art-card span{
    display:block;
    min-height:54px;
    padding:10px 11px 12px;
    color:rgba(255,255,255,.78);
    font:600 12px/1.45 var(--sans);
  }

  .series-card span{
    min-height:72px;
    padding:14px 13px 16px;
  }

  .series-card span strong{
    display:block;
    font-size:15px;
    font-weight:700;
    margin-bottom:4px;
    color:var(--gold-bright);
  }

  .series-card span small{
    font-size:11px;
    font-weight:500;
    color:rgba(255,255,255,.65);
  }

  .detail{
    position:fixed;
    z-index:30;
    inset:0;
    display:none;
    background:rgba(1,9,17,.92);
    backdrop-filter:blur(22px);
  }

  .detail.is-open{display:block;}

  .detail-inner{
    position:absolute;
    inset:0;
    overflow:hidden;
  }

  .detail-image{
    position:absolute;
    inset:0;
    display:flex;
    align-items:center;
    justify-content:center;
    overflow:hidden;
    touch-action:none;
    background:
      radial-gradient(ellipse at center, rgba(18,74,101,.2), transparent 62%),
      #010a12;
  }

  .detail-image img{
    width:auto;
    height:auto;
    max-width:92vw;
    max-height:88vh;
    display:block;
    object-fit:contain;
    transform:translate3d(0,0,0) scale(1);
    transform-origin:center;
    transition:transform .18s ease;
    user-select:none;
    -webkit-user-drag:none;
    cursor:zoom-in;
  }

  .detail-image.is-zoomed img{
    cursor:grab;
    transition:none;
  }

  .viewer-top{
    position:absolute;
    z-index:3;
    top:22px;
    left:24px;
    right:24px;
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:16px;
    pointer-events:none;
  }

  .viewer-index{
    color:rgba(255,255,255,.68);
    font:500 11px/1 var(--sans);
    pointer-events:auto;
  }

  .viewer-tools{
    display:flex;
    align-items:center;
    gap:8px;
    pointer-events:auto;
  }

  .icon-button{
    width:38px;
    height:38px;
    display:grid;
    place-items:center;
    border-radius:50%;
    border:1px solid rgba(255,255,255,.2);
    background:rgba(3,24,42,.56);
    color:#fff;
    font:500 20px/1 var(--sans);
    cursor:pointer;
    backdrop-filter:blur(12px);
  }

  .icon-button:hover{
    border-color:rgba(255,226,154,.62);
    background:rgba(8,58,88,.72);
  }

  .viewer-step{
    position:absolute;
    z-index:2;
    top:50%;
    width:52px;
    height:72px;
    margin-top:-36px;
    border:0;
    border-radius:0;
    background:transparent;
    color:rgba(255,255,255,.66);
    font:300 42px/1 var(--sans);
    cursor:pointer;
  }

  .viewer-step:hover{color:var(--gold-bright);}
  .viewer-prev{left:10px;}
  .viewer-next{right:10px;}

  .detail-copy{
    position:absolute;
    z-index:4;
    left:0;
    right:0;
    bottom:0;
    height:clamp(168px, 25vh, 292px);
    min-height:64px;
    max-height:56vh;
    padding:18px clamp(22px, 4vw, 64px) 24px;
    overflow:auto;
    resize:vertical;
    border-top:1px solid rgba(255,226,154,.24);
    background:linear-gradient(180deg, rgba(3,24,42,.76), rgba(2,17,30,.94));
    backdrop-filter:blur(24px);
    transition:height .25s ease, padding .25s ease;
  }

  .detail-copy.is-collapsed{
    height:64px !important;
    min-height:64px;
    padding-top:13px;
    padding-bottom:10px;
    resize:none;
    overflow:hidden;
  }

  .detail-top{
    display:grid;
    grid-template-columns:minmax(0, 1fr) auto;
    gap:20px;
    align-items:start;
  }

  .detail h3{
    margin:0;
    overflow:hidden;
    color:var(--gold-bright);
    font:600 clamp(20px, 2.4vw, 32px)/1.15 'Cormorant Garamond',serif;
    white-space:nowrap;
    text-overflow:ellipsis;
  }

  .detail-meta{
    margin:6px 0 0;
    color:var(--ink-dim);
    font:500 11px/1.4 var(--sans);
  }

  .drawer-toggle{
    min-width:72px;
    padding:4px 0 7px;
    border:0;
    border-bottom:1px solid rgba(255,255,255,.3);
    border-radius:0;
    background:transparent;
    color:rgba(255,255,255,.72);
    font:500 11px/1.2 var(--sans);
    cursor:pointer;
  }

  .detail-fields{
    display:grid;
    grid-template-columns:repeat(2, minmax(0, 1fr));
    gap:32px;
    margin-top:18px;
  }

  .detail-copy.is-collapsed .detail-fields,
  .detail-copy.is-collapsed .detail-meta{display:none;}

  .field{margin:0;}

  .field label{
    display:block;
    margin-bottom:7px;
    color:rgba(191,230,255,.7);
    font:600 10px/1 var(--sans);
    text-transform:uppercase;
  }

  .field p{
    margin:0;
    color:rgba(255,255,255,.74);
    font:400 12.5px/1.7 var(--sans);
  }

  @media (max-width:720px){
    .topbar{
      top:20px;
      left:16px;
      right:16px;
      align-items:flex-start;
    }
    .topbar{align-items:flex-start;}
    .brand span{font-size:15px;}
    .nav-links{gap:8px;}
    .nav-links a{padding:9px 12px;font-size:12px;}
    .gallery-stage{min-height:620px;padding-top:92px;}
    .experience{position:relative;min-height:520px;}
    .scene-toolbar{position:relative;z-index:3;display:block;padding:14px 16px;top:auto;left:auto;right:auto;}
    .museum-hud{width:100%;margin-bottom:14px;}
    .hud-copy{max-width:44ch;}
    .room-jump{
      flex-direction:row;
      align-items:flex-start;
      justify-content:flex-start;
      width:100%;
      max-width:none;
      overflow-x:auto;
      padding-bottom:3px;
    }
    .room-jump button{
      display:block;
      width:auto;
      min-width:auto;
      flex:0 0 auto;
      text-align:left;
      margin-right:18px;
    }
    .room-jump .nav-index,
    .room-jump .nav-count{display:none;}
    .scene-status{display:none;}
    .scene-mount{display:none;}
    .scene-fallback{display:flex;position:relative;min-height:190px;background:rgba(3,24,42,.38);}
    .catalog{width:calc(100% - 32px);padding-top:36px;}
    .catalog-head{display:block;}
    .filter-bar{
      flex-direction:row;
      justify-content:flex-start;
      align-items:flex-start;
      min-width:0;
      margin-top:16px;
      overflow-x:auto;
    }
    .filter-bar button{min-width:auto;flex:0 0 auto;text-align:left;margin-right:18px;}
    .catalog-grid{grid-template-columns:repeat(2, minmax(0, 1fr));gap:10px;}
    .viewer-top{top:14px;left:14px;right:14px;}
    .viewer-tools{gap:5px;}
    .icon-button{width:34px;height:34px;font-size:18px;}
    .viewer-step{width:42px;height:60px;margin-top:-30px;}
    .viewer-prev{left:0;}
    .viewer-next{right:0;}
    .detail-image img{max-width:94vw;max-height:78vh;}
    .detail-copy{
      height:clamp(190px, 32vh, 320px);
      max-height:58vh;
      padding:16px 18px 22px;
    }
    .detail-fields{grid-template-columns:1fr;gap:16px;}
  }

  @media (prefers-reduced-motion:reduce){
    html{scroll-behavior:auto;}
    *{transition:none !important;}
  }
</style>
</head>
<body>
  <canvas id="galleryField" aria-hidden="true"></canvas>
  <div class="page">
    <nav class="topbar">
      <a class="brand" href="/">
        <img src="/assets/brocademaple-maple-mark.png" alt="brocademaple maple mark">
        <span>brocademaple</span>
      </a>
      <div class="nav-links" aria-label="Site navigation">
        <a href="/">Home</a>
        <a href="/#projects" class="nav-cta">Projects</a>
      </div>
    </nav>

    <main>
      <section class="gallery-stage" aria-label="Gallery exhibition">
        <section class="experience" id="experience" aria-label="3D gallery">
          <div class="scene-toolbar">
            <div class="museum-hud">
              <div class="hud-kicker">Digital museum 00</div>
              <h1 class="hud-title">The Sunken Archive</h1>
              <p class="hud-copy">沿沉没长廊，进入三座展区。</p>
              <div class="hud-actions">
                <button type="button" id="lobbyButton">返回中庭</button>
                <button type="button" id="guideButton">行走指南</button>
              </div>
            </div>
            <div class="room-jump" id="roomJump" aria-label="Jump to room"></div>
          </div>
          <div class="scene-mount" id="sceneMount"></div>
          <div class="scene-fallback" id="sceneFallback">WebGL is not active here. The full catalog is available below.</div>
          <div class="scene-status">
            <div class="current-place">当前位置<strong id="currentPlace">中央中庭</strong></div>
            <button type="button" class="archive-link" id="archiveLink">作品目录 ↓</button>
          </div>
        </section>
      </section>

      <section class="catalog" id="catalog" aria-labelledby="catalog-title">
        <div class="catalog-head">
          <div>
            <h2 id="catalog-title">Catalog</h2>
            <p>按主题系列浏览，或查看完整馆藏。</p>
          </div>
          <div class="filter-bar" id="filterBar" aria-label="Filter catalog"></div>
        </div>
        <div class="catalog-grid" id="catalogGrid"></div>
      </section>
    </main>
  </div>

  <aside class="detail" id="detail" aria-hidden="true">
    <div class="detail-inner" role="dialog" aria-modal="true" aria-labelledby="detailTitle">
      <div class="detail-image" id="detailImageStage"><img id="detailImage" alt=""></div>
      <div class="viewer-top">
        <span class="viewer-index" id="detailIndex">01 / 01</span>
        <div class="viewer-tools" aria-label="Artwork controls">
          <button type="button" class="icon-button" id="zoomOut" aria-label="Zoom out" title="缩小">−</button>
          <button type="button" class="icon-button" id="zoomReset" aria-label="Reset zoom" title="恢复大小">1:1</button>
          <button type="button" class="icon-button" id="zoomIn" aria-label="Zoom in" title="放大">+</button>
          <button type="button" class="icon-button" id="detailClose" aria-label="Close artwork" title="关闭">×</button>
        </div>
      </div>
      <button type="button" class="viewer-step viewer-prev" id="detailPrev" aria-label="Previous artwork" title="上一张">‹</button>
      <button type="button" class="viewer-step viewer-next" id="detailNext" aria-label="Next artwork" title="下一张">›</button>
      <div class="detail-copy" id="detailDrawer">
        <div class="detail-top">
          <div>
            <h3 id="detailTitle"></h3>
            <p class="detail-meta" id="detailMeta"></p>
          </div>
          <button type="button" class="drawer-toggle" id="drawerToggle" aria-expanded="true">制作笔记</button>
        </div>

<script type="module">

const state = {

const reducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

function webglAvailable(){

    const canvas = document.createElement('canvas');
    return !!(window.WebGLRenderingContext && (canvas.getContext('webgl') || canvas.getContext('experimental-webgl')));
  }catch(error){

function textOrPending(value, fallback){
  return value && String(value).trim() ? value : fallback;
}

function initGalleryParticles(){
  const canvas = document.getElementById('galleryField');
  if(!canvas || reducedMotion) return;
  const ctx = canvas.getContext('2d');
  let W = 0;
  let H = 0;
  let DPR = 1;

  function resize(){
    DPR = Math.min(window.devicePixelRatio || 1, 1.5);
    W = canvas.width = window.innerWidth * DPR;
    H = canvas.height = window.innerHeight * DPR;
    canvas.style.width = window.innerWidth + 'px';
    canvas.style.height = window.innerHeight + 'px';
  }

  function rand(a, b){ return a + Math.random() * (b - a); }
  function gaussianish(){ return (Math.random() + Math.random() + Math.random() - 1.5) / 1.5; }
  function palette(){
    const root = getComputedStyle(document.body);
    return [
      root.getPropertyValue('--particle-a').trim(),
      root.getPropertyValue('--particle-b').trim(),
      root.getPropertyValue('--particle-c').trim()
    ];
  }

  const loopCenter = {x:.55, y:.38};
  const loopRadius = {x:.52, y:.30};
  const loopRotation = -32 * Math.PI / 180;
  const rotCos = Math.cos(loopRotation);
  const rotSin = Math.sin(loopRotation);
  const isSmall = window.innerWidth < 800;
  const particles = [];

  function loopPoint(t){
    const a = t * Math.PI * 2;
    const ex = Math.cos(a) * loopRadius.x;
    const ey = Math.sin(a) * loopRadius.y;
    const wx = ex * rotCos - ey * rotSin;
    const wy = ex * rotSin + ey * rotCos;
    return {x:(loopCenter.x + wx) * W, y:(loopCenter.y + wy) * H};
  }

  function loopTangent(t){
    const a = t * Math.PI * 2;
    const dex = -Math.sin(a) * loopRadius.x;
    const dey = Math.cos(a) * loopRadius.y;
    const dx = dex * rotCos - dey * rotSin;
    const dy = dex * rotSin + dey * rotCos;
    const len = Math.hypot(dx, dy) || 1;
    return {x:dx / len, y:dy / len};
  }

  class Particle{
    constructor(isStray){
      this.isStray = isStray;
      this.reset();
    }
    reset(){
      this.t = this.isStray ? null : Math.random();
      if(this.isStray){
        this.x = rand(0, W);
        this.y = rand(0, H);
      }else{
        const pt = loopPoint(this.t);
        const tan = loopTangent(this.t);
        const perp = {x:-tan.y, y:tan.x};
        this.perpOffset = gaussianish() * Math.min(W, H) * .24;
        this.x = pt.x + perp.x * this.perpOffset;
        this.y = pt.y + perp.y * this.perpOffset;
      }
      const r = Math.random();
      this.type = r < .58 ? 'chip' : (r < .82 ? 'glint' : 'dust');
      this.color = Math.floor(rand(0, 3));
      this.angle = rand(0, Math.PI * 2);
      this.spin = rand(-.01, .01);
      this.speed = this.isStray ? rand(.04, .12) : rand(.00095, .00132);
      this.vx = this.isStray ? rand(-.12, .12) * DPR : 0;
      this.vy = this.isStray ? rand(-.18, -.04) * DPR : 0;
      this.depth = this.isStray ? rand(.2, .5) : rand(.55, 1.35);
      this.len = (this.type === 'chip' ? rand(5, 14) : this.type === 'glint' ? rand(1.6, 3.4) : rand(2, 4)) * DPR * this.depth;
      this.alpha = this.isStray ? rand(.12, .3) : rand(.42, .92);
      this.phase = rand(0, Math.PI * 2);
      this.twinkleSpeed = rand(.001, .003);
    }
    update(t, frameScale){
      if(this.isStray){
        this.x += this.vx * frameScale;
        this.y += this.vy * frameScale;
        if(this.x < -20 || this.x > W + 20 || this.y < -20 || this.y > H + 20) this.reset();
      }else{
        this.t = (this.t + this.speed * frameScale) % 1;
        const pt = loopPoint(this.t);
        const tan = loopTangent(this.t);
        const perp = {x:-tan.y, y:tan.x};
        const wobble = Math.sin(t * .0006 + this.phase) * 3 * DPR;
        this.x = pt.x + perp.x * (this.perpOffset + wobble);
        this.y = pt.y + perp.y * (this.perpOffset + wobble);
      }
      this.angle += this.spin * frameScale;
      this.twinkle = .6 + .4 * Math.sin(t * this.twinkleSpeed + this.phase);
    }
    draw(colors){
      const rgb = colors[this.color];
      const alpha = Math.min(1, this.alpha * this.twinkle);
      ctx.save();
      ctx.translate(this.x, this.y);
      ctx.rotate(this.angle);
      ctx.globalAlpha = alpha;
      if(this.type === 'chip'){
        const h = this.len;
        const w = this.len * .46;
        const grad = ctx.createLinearGradient(0, -h / 2, 0, h / 2);
        grad.addColorStop(0, `rgba(${rgb},1)`);
        grad.addColorStop(.5, `rgba(${rgb},.55)`);
        grad.addColorStop(1, `rgba(${rgb},.9)`);
        ctx.fillStyle = grad;
        ctx.beginPath();
        ctx.moveTo(0, -h / 2);
        ctx.lineTo(w / 2, 0);
        ctx.lineTo(0, h / 2);
        ctx.lineTo(-w / 2, 0);
        ctx.closePath();
        ctx.fill();
      }else{
        ctx.fillStyle = `rgba(${rgb},.9)`;
        ctx.beginPath();
        ctx.arc(0, 0, this.len / 2, 0, Math.PI * 2);
        ctx.fill();
      }
      ctx.restore();
    }
  }

  resize();
  window.addEventListener('resize', resize);
  for(let i = 0; i < (isSmall ? 460 : 860); i++) particles.push(new Particle(false));
  for(let i = 0; i < (isSmall ? 44 : 92); i++) particles.push(new Particle(true));

  let last = performance.now();
  function loop(t){
    const dt = Math.min(40, Math.max(8, t - last || 16.67));
    last = t;
    const frameScale = dt / 16.67;
    const colors = palette();
    ctx.clearRect(0, 0, W, H);
    for(const particle of particles){
      particle.update(t, frameScale);
      particle.draw(colors);
    }
    requestAnimationFrame(loop);
  }
  requestAnimationFrame(loop);
}

function uniqueRooms(artworks){
  const seen = new Set();
  const result = [];
  for(const item of artworks){
    if(seen.has(item.room)) continue;
    seen.add(item.room);
    result.push({id:item.room, label:roomLabels[item.room] || item.room, title:item.roomTitle});
  }
  return result;
}

function makeButton(label, active, onClick){
  const button = document.createElement('button');
  button.type = 'button';
  button.textContent = label;
  if(active) button.classList.add('is-active');
  button.addEventListener('click', onClick);
  return button;
}

function makeNavButton(room, index){
  const button = document.createElement('button');
  button.type = 'button';
  button.dataset.room = room.id;
  button.classList.toggle('is-active', state.currentRoom === room.id);
  button.innerHTML = `<span class="nav-index">${String(index + 1).padStart(2, '0')}</span><span class="nav-label">${room.label}</span><span class="nav-count">${String(state.artworks.filter(item => item.room === room.id && item.featured && item.published !== false).length).padStart(2, '0')}</span>`;
  button.addEventListener('click', () => focusRoom(room.id));
  return button;
}

function renderControls(){
  const jump = document.getElementById('roomJump');
  const filters = document.getElementById('filterBar');
  jump.innerHTML = '';
  filters.innerHTML = '';

  state.rooms.forEach((room, index) => jump.appendChild(makeNavButton(room, index)));

  filters.appendChild(makeButton('All', state.activeRoom === 'all', () => setFilter('all')));
  for(const room of state.rooms){
    filters.appendChild(makeButton(room.label, state.activeRoom === room.id, () => setFilter(room.id)));
  }
}

function setFilter(room){
  state.activeRoom = room;
  renderCatalog();
  renderControls();
}

function renderCatalog(){
  const grid = document.getElementById('catalogGrid');
  const published = state.artworks.filter(item => item.published !== false);
  
  if(state.activeRoom === 'all'){
    // 系列封面视图
    grid.innerHTML = '';
    grid.style.gridTemplateColumns = 'repeat(auto-fill, minmax(220px, 1fr))';
    const fragment = document.createDocumentFragment();
    state.rooms.forEach(room => {
      const roomItems = published.filter(item => item.room === room.id);
      const highlight = roomItems.find(item => item.highlight) || roomItems[0];
      if(!highlight) return;
      
      const button = document.createElement('button');
      button.type = 'button';
      button.className = 'art-card series-card';
      button.addEventListener('click', () => setFilter(room.id));
      
      const img = document.createElement('img');
      img.src = highlight.thumb;
      img.alt = room.label;
      img.loading = 'lazy';
      img.width = 360;
      img.height = Math.max(300, Math.round(360 / (highlight.aspect || .8)));
      
      const label = document.createElement('span');
      label.innerHTML = `<strong>${room.label}</strong><br><small>${roomItems.length} 件作品</small>`;
      
      button.append(img, label);
      fragment.appendChild(button);
    });
    grid.appendChild(fragment);
  } else {
    // 作品网格视图
    grid.style.gridTemplateColumns = 'repeat(auto-fill, minmax(150px, 1fr))';
    const items = published.filter(item => item.room === state.activeRoom);
    grid.innerHTML = '';
    const fragment = document.createDocumentFragment();
    for(const item of items){
      const button = document.createElement('button');
      button.type = 'button';
      button.className = 'art-card';
      button.addEventListener('click', () => openDetail(item, items));
      const img = document.createElement('img');
      img.src = item.thumb;
      img.alt = item.displayTitle || item.title;
      img.loading = 'lazy';
      img.width = 360;
      img.height = Math.max(240, Math.round(360 / (item.aspect || .8)));
      const label = document.createElement('span');
      label.textContent = item.displayTitle || item.title;
      button.append(img, label);
      fragment.appendChild(button);
    }
    grid.appendChild(fragment);
  }
}

function resetViewerTransform(){
  state.viewerZoom = 1;
  state.viewerX = 0;
  state.viewerY = 0;
  applyViewerTransform();
}

function applyViewerTransform(){
  const image = document.getElementById('detailImage');
  const stage = document.getElementById('detailImageStage');
  image.style.transform = `translate3d(${state.viewerX}px, ${state.viewerY}px, 0) scale(${state.viewerZoom})`;
  stage.classList.toggle('is-zoomed', state.viewerZoom > 1);
}

function renderViewerItem(){
  const item = state.viewerItems[state.viewerIndex];
  if(!item) return;
  document.getElementById('detailImage').src = item.src;
  document.getElementById('detailImage').alt = item.displayTitle || item.title;
  document.getElementById('detailTitle').textContent = item.displayTitle || item.title;
  const statusLabel = item.status === 'highlight' ? '核心' : '入展';
  document.getElementById('detailMeta').textContent = `${roomLabels[item.room] || item.roomTitle} · ${statusLabel}`;
  document.getElementById('detailPrompt').textContent = textOrPending(item.prompt, '该组提示词正在整理中。');
  document.getElementById('detailTranslation').textContent = textOrPending(item.translation, '该组中文翻译正在整理中。');
  document.getElementById('detailCuratorNote').textContent = textOrPending(item.curatorNote, '');
  document.getElementById('detailIndex').textContent = `${String(state.viewerIndex + 1).padStart(2, '00')} / ${String(state.viewerItems.length).padStart(2, '00')}`;
  resetViewerTransform();
}

function openDetail(item, collection){
  state.viewerItems = (collection && collection.length ? collection : state.artworks.filter(entry => entry.published !== false));
  state.viewerIndex = Math.max(0, state.viewerItems.findIndex(entry => entry.id === item.id));
  renderViewerItem();
  const detail = document.getElementById('detail');
  detail.classList.add('is-open');
  detail.setAttribute('aria-hidden', 'false');
  document.body.style.overflow = 'hidden';
  document.getElementById('detailClose').focus({preventScroll:true});
}

function moveViewer(direction){
  if(!state.viewerItems.length) return;
  state.viewerIndex = (state.viewerIndex + direction + state.viewerItems.length) % state.viewerItems.length;
  renderViewerItem();
}

function setViewerZoom(nextZoom){
  state.viewerZoom = Math.max(1, Math.min(5, nextZoom));
  if(state.viewerZoom === 1){
    state.viewerX = 0;
    state.viewerY = 0;
  }
  applyViewerTransform();
}

function closeDetail(){
  const detail = document.getElementById('detail');
  detail.classList.remove('is-open');
  detail.setAttribute('aria-hidden', 'true');
  document.body.style.overflow = '';
  resetViewerTransform();
}

document.getElementById('detailClose').addEventListener('click', closeDetail);
document.getElementById('detailPrev').addEventListener('click', () => moveViewer(-1));
document.getElementById('detailNext').addEventListener('click', () => moveViewer(1));
document.getElementById('zoomIn').addEventListener('click', () => setViewerZoom(state.viewerZoom + .5));
document.getElementById('zoomOut').addEventListener('click', () => setViewerZoom(state.viewerZoom - .5));
document.getElementById('zoomReset').addEventListener('click', resetViewerTransform);
document.getElementById('drawerToggle').addEventListener('click', () => {
  const techDetails = document.getElementById('techDetails');
  const isHidden = techDetails.style.display === 'none';
  techDetails.style.display = isHidden ? 'grid' : 'none';
  const toggle = document.getElementById('drawerToggle');
  toggle.textContent = isHidden ? '收起笔记' : '制作笔记';
  toggle.setAttribute('aria-expanded', String(isHidden));
});
document.getElementById('detail').addEventListener('click', event => {
  if(event.target.id === 'detail') closeDetail();
});
const viewerStage = document.getElementById('detailImageStage');
let viewerDrag = null;
viewerStage.addEventListener('wheel', event => {
  event.preventDefault();
  setViewerZoom(state.viewerZoom + (event.deltaY < 0 ? .35 : -.35));
}, {passive:false});
viewerStage.addEventListener('dblclick', () => setViewerZoom(state.viewerZoom > 1 ? 1 : 2));
viewerStage.addEventListener('pointerdown', event => {
  if(state.viewerZoom <= 1) return;
  viewerDrag = {x:event.clientX, y:event.clientY, originX:state.viewerX, originY:state.viewerY};
  viewerStage.setPointerCapture(event.pointerId);
});
viewerStage.addEventListener('pointermove', event => {
  if(!viewerDrag) return;
  state.viewerX = viewerDrag.originX + event.clientX - viewerDrag.x;
  state.viewerY = viewerDrag.originY + event.clientY - viewerDrag.y;
  applyViewerTransform();
});
viewerStage.addEventListener('pointerup', () => { viewerDrag = null; });
window.addEventListener('keydown', event => {
  if(!document.getElementById('detail').classList.contains('is-open')) return;
  if(event.key === 'Escape') closeDetail();
  if(event.key === 'ArrowLeft') moveViewer(-1);
  if(event.key === 'ArrowRight') moveViewer(1);
  if(event.key === '+' || event.key === '=') setViewerZoom(state.viewerZoom + .5);
  if(event.key === '-') setViewerZoom(state.viewerZoom - .5);
});

function showFallback(message){
  const experience = document.getElementById('experience');
  const fallback = document.getElementById('sceneFallback');
  if(message) fallback.textContent = message;
  experience.classList.add('is-fallback');
}

  const ceiling = new THREE.Mesh(
    new THREE.PlaneGeometry(34, 34),
    new THREE.MeshStandardMaterial({color:0x0b3a4c, roughness:.98, metalness:0, side:THREE.DoubleSide})
  );
  ceiling.rotation.x = Math.PI / 2;
  ceiling.position.y = 5.4;
  scene.add(ceiling);

  const ceilingGlow = new THREE.Mesh(
    new THREE.PlaneGeometry(26, 26),
    new THREE.MeshBasicMaterial({color:0x1f8fc4, transparent:true, opacity:.08, side:THREE.DoubleSide})
  );
  ceilingGlow.rotation.x = Math.PI / 2;
  ceilingGlow.position.y = 5.385;
  scene.add(ceilingGlow);

  const textureLoader = new THREE.TextureLoader();
  const interactive = [];

  const featured = state.artworks.filter(item => item.featured);
  const byRoom = new Map();
  for(const item of featured){
    if(!byRoom.has(item.room)) byRoom.set(item.room, []);
    byRoom.get(item.room).push(item);
  }

  function causticTexture(){
    const canvas = document.createElement('canvas');
    canvas.width = 768;
    canvas.height = 768;
    const ctx = canvas.getContext('2d');
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    ctx.strokeStyle = 'rgba(158,228,239,.34)';
    ctx.lineWidth = 2;
    for(let row = 0; row < 12; row++){
      for(let col = 0; col < 12; col++){
        const x = col * 72 + (row % 2) * 28;
        const y = row * 68;
        ctx.beginPath();
        ctx.ellipse(x, y, 42 + (col % 3) * 8, 15 + (row % 3) * 4, (row + col) * .17, 0, Math.PI * 2);
        ctx.stroke();
      }
    }
    const tex = new THREE.CanvasTexture(canvas);
    tex.wrapS = tex.wrapT = THREE.RepeatWrapping;
    tex.repeat.set(2.6, 2.6);
    tex.colorSpace = THREE.SRGBColorSpace;
    return tex;
  }

    ctx.font = '600 36px "Noto Sans SC", "Noto Sans Simplified Chinese", sans-serif';
    ctx.fillStyle = 'rgba(191,230,255,.78)';
    ctx.fillText(subtext, 50, 172);
    const tex = new THREE.CanvasTexture(canvas);
    tex.colorSpace = THREE.SRGBColorSpace;
    return tex;
  }

    ctx.fillStyle = 'rgba(191,230,255,.76)';
    ctx.fillText('海底遗址档案馆', 96, 108);

    const gradient = ctx.createLinearGradient(96, 0, 1320, 0);
    gradient.addColorStop(0, '#fff6d4');
    gradient.addColorStop(.42, '#ffe29a');
    gradient.addColorStop(.74, '#e8b54a');
    gradient.addColorStop(1, '#1f8fc4');
    ctx.font = '900 210px "Noto Serif SC", serif';
    ctx.fillStyle = gradient;
    ctx.fillText('The Sunken Archive', 92, 330);

    ctx.font = '500 54px "Noto Serif SC", serif';
    ctx.fillStyle = 'rgba(245,243,238,.82)';
    ctx.fillText('沿沉没长廊进入六座展厅，色彩、重构、光影、材质、情绪、物件的实验片段留存于此。', 100, 430);

  function chipTexture(rgb){
    const canvas = document.createElement('canvas');
    canvas.width = 96;
    canvas.height = 96;
    const ctx = canvas.getContext('2d');
    const grad = ctx.createLinearGradient(0, 8, 0, 88);
    grad.addColorStop(0, `rgba(${rgb},1)`);
    grad.addColorStop(.48, `rgba(${rgb},.48)`);
    grad.addColorStop(1, `rgba(${rgb},.86)`);
    ctx.fillStyle = grad;
    ctx.beginPath();
    ctx.moveTo(48, 6);
    ctx.lineTo(78, 48);
    ctx.lineTo(48, 90);
    ctx.lineTo(18, 48);
    ctx.closePath();
    ctx.fill();
    const tex = new THREE.CanvasTexture(canvas);
    tex.colorSpace = THREE.SRGBColorSpace;
    return tex;
  }

  function addGoldDustField(){
    if(reducedMotion) return null;
    const textures = [chipTexture('255,206,107'), chipTexture('255,255,255'), chipTexture('255,225,140')];
    const group = new THREE.Group();
    const chips = [];
    for(let i = 0; i < 280; i++){
      const t = Math.random();
      const a = t * Math.PI * 2;
      const ex = Math.cos(a) * 12.8;
      const ey = Math.sin(a) * 3.8;
      const rot = -32 * Math.PI / 180;
      const x = ex * Math.cos(rot) - ey * Math.sin(rot);
      const y = 2.72 + ex * Math.sin(rot) * .13 + ey * Math.cos(rot) * .28;
      const z = -3.6 + (Math.random() - .5) * 24;
      const material = new THREE.SpriteMaterial({
        map:textures[Math.floor(Math.random() * textures.length)],
        transparent:true,
        opacity:.12 + Math.random() * .3,
        depthWrite:false
      });
      const sprite = new THREE.Sprite(material);
      const size = .028 + Math.random() * .1;
      sprite.scale.set(size * .52, size, 1);
      sprite.position.set(x + (Math.random() - .5) * 4.8, Math.max(.32, Math.min(5.12, y)), z);
      sprite.userData.speed = .00022 + Math.random() * .00042;
      sprite.userData.phase = Math.random() * Math.PI * 2;
      chips.push(sprite);
      group.add(sprite);
    }
    group.userData.chips = chips;
    scene.add(group);
    return group;
  }

  function addWalkway(group, spec){
    const entrance = group.localToWorld(new THREE.Vector3(0, 0, spec.depth / 2 + .05));
    const distance = Math.hypot(entrance.x, entrance.z);
    const innerRadius = 1.7;
    const length = Math.max(2.4, distance - innerRadius);
    const midpointRadius = innerRadius + length / 2;
    const walkway = new THREE.Mesh(
      new THREE.BoxGeometry(spec.pathWidth || .72, .035, length),
      new THREE.MeshStandardMaterial({color:0x11658a, roughness:.76, metalness:.02, transparent:true, opacity:.86})
    );
    walkway.position.set((entrance.x / distance) * midpointRadius, .035, (entrance.z / distance) * midpointRadius);
    walkway.rotation.y = Math.atan2(entrance.x, entrance.z);
    walkway.receiveShadow = true;
    scene.add(walkway);

    const edgeMaterial = new THREE.MeshBasicMaterial({color:0x3aa7c6, transparent:true, opacity:.32});
    [-1, 1].forEach(side => {
      const edge = new THREE.Mesh(new THREE.BoxGeometry(.035, .045, length), edgeMaterial);
      edge.position.set(
        (entrance.x / distance) * midpointRadius + Math.cos(Math.atan2(entrance.x, entrance.z)) * side * (spec.pathWidth || .72) * .46,
        .065,
        (entrance.z / distance) * midpointRadius - Math.sin(Math.atan2(entrance.x, entrance.z)) * side * (spec.pathWidth || .72) * .46
      );
      edge.rotation.y = Math.atan2(entrance.x, entrance.z);
      scene.add(edge);
    });
  }

  function shapePoints(shape){
    if(shape === 'triangle') return [[0, .62], [.62, -.45], [-.54, -.45]];
    if(shape === 'trapezoid') return [[-.56, .5], [.48, .36], [.62, -.56], [-.38, -.66]];
    if(shape === 'arc') return [[-.58, .2], [-.26, .62], [.44, .5], [.64, -.48], [.12, -.58], [-.18, -.06]];
    return [[-.48, .68], [.48, .68], [.48, -.68], [-.48, -.68]];
  }

  function polygonGeometry(points, depth){
    const shape = new THREE.Shape();
    shape.moveTo(points[0][0], points[0][1]);
    points.slice(1).forEach(point => shape.lineTo(point[0], point[1]));
    shape.closePath();
    const geometry = depth
      ? new THREE.ExtrudeGeometry(shape, {depth, bevelEnabled:true, bevelSegments:2, bevelSize:.025, bevelThickness:.025, curveSegments:2})
      : new THREE.ShapeGeometry(shape, 2);
    geometry.computeBoundingBox();
    const box = geometry.boundingBox;
    const rangeX = Math.max(.001, box.max.x - box.min.x);
    const rangeY = Math.max(.001, box.max.y - box.min.y);
    const uv = [];
    const position = geometry.attributes.position;
    for(let i = 0; i < position.count; i++){
      uv.push((position.getX(i) - box.min.x) / rangeX, (position.getY(i) - box.min.y) / rangeY);
    }
    geometry.setAttribute('uv', new THREE.Float32BufferAttribute(uv, 2));
    return geometry;
  }

  function addMosaicCluster(group, spec, layout){
    const artworkById = new Map(state.artworks.map(item => [item.id, item]));
    const clusterItems = layout.tiles.map(tile => ({tile, item:artworkById.get(tile.artworkId)})).filter(entry => entry.item);
    if(!clusterItems.length) return;

    const cluster = new THREE.Group();
    cluster.position.set(layout.center[0], layout.center[1], -spec.depth / 2 + .24);
    group.add(cluster);

    const halo = new THREE.Mesh(
      new THREE.TorusGeometry(layout.radius, .045, 12, 64),
      new THREE.MeshStandardMaterial({color:0x8cb2a7, roughness:.92, metalness:.02, transparent:true, opacity:.58})
    );
    halo.position.z = -.08;
    cluster.add(halo);

    const voidDisk = new THREE.Mesh(
      new THREE.CircleGeometry(layout.radius - .1, 64),
      new THREE.MeshBasicMaterial({color:0x062e3b, transparent:true, opacity:.64, side:THREE.DoubleSide})
    );
    voidDisk.position.z = -.06;
    cluster.add(voidDisk);

    clusterItems.forEach(({tile, item}) => {
      const points = shapePoints(tile.shape).map(([x, y]) => [x * tile.scale, y * tile.scale]);
      const frame = new THREE.Mesh(
        polygonGeometry(points.map(([x, y]) => [x * 1.12, y * 1.12]), .11),
        new THREE.MeshStandardMaterial({color:0x123a43, roughness:.96, metalness:0})
      );
      frame.position.set(tile.x, tile.y, .01);
      frame.rotation.z = tile.rotation || 0;
      frame.castShadow = true;
      cluster.add(frame);

      const edgePoints = points.map(([x, y]) => new THREE.Vector3(x, y, .15));
      edgePoints.push(edgePoints[0].clone());
      const edge = new THREE.Line(
        new THREE.BufferGeometry().setFromPoints(edgePoints),
        new THREE.LineBasicMaterial({color:0xc8a85a, transparent:true, opacity:.9})
      );
      edge.position.set(tile.x, tile.y, 0);
      edge.rotation.z = tile.rotation || 0;
      cluster.add(edge);

      const texture = textureLoader.load(
        item.src,
        undefined,
        undefined,
        (error) => {
          console.error(`Failed to load mosaic texture for ${item.id}:`, item.src, error);
        }
      );
      texture.colorSpace = THREE.SRGBColorSpace;
      const art = new THREE.Mesh(
        polygonGeometry(points, 0),
        new THREE.MeshBasicMaterial({map:texture, side:THREE.DoubleSide, color:0xffffff})
      );
      art.position.set(tile.x, tile.y, .16);
      art.rotation.z = tile.rotation || 0;
      art.userData.artwork = item;
      art.userData.mosaicTile = true;
      art.userData.homeZ = .16;
      interactive.push(art);
      cluster.add(art);
    });

    const label = new THREE.Mesh(
      new THREE.PlaneGeometry(2.8, .4),
      new THREE.MeshBasicMaterial({map:labelTexture(layout.title, layout.subtitle), transparent:true, side:THREE.DoubleSide})
    );
    label.position.set(0, -layout.radius - .42, .04);
    cluster.add(label);
  }

  function addRoom(room, index, total){

    group.position.set(spec.x, 0, spec.z);
    group.lookAt(0, 2.35, 0);
    group.rotation.y += spec.turn || 0;
    group.userData.roomSpec = spec;
    scene.add(group);
    collisionRooms.push({group, width:roomWidth, depth:roomDepth, doorwayWidth:3.25});
    addWalkway(group, spec);

    const backWall = new THREE.Mesh(new THREE.PlaneGeometry(roomWidth, roomHeight), darkWallMaterial);

    const rightWall = new THREE.Mesh(new THREE.PlaneGeometry(roomDepth, roomHeight), wallMaterial);

    addBox(group, new THREE.BoxGeometry(trimDepth, roomHeight, trimDepth), goldMaterial, new THREE.Vector3(-roomWidth / 2 - .04, roomHeight / 2, -roomDepth / 2 - .08));
    addBox(group, new THREE.BoxGeometry(trimDepth, roomHeight, trimDepth), goldMaterial, new THREE.Vector3(roomWidth / 2 + .04, roomHeight / 2, -roomDepth / 2 - .08));

    const doorwayWidth = 3.25;

      frontSegment.position.set(side * (doorwayWidth / 2 + frontSideWidth / 2), roomHeight / 2, entranceZ);

    addBox(group, new THREE.BoxGeometry(doorwayWidth + .22, .18, .2), goldMaterial, new THREE.Vector3(0, roomHeight - .28, entranceZ));

        goldMaterial
      );
      const wall = placement.wall;
      const x = placement.x || 0;
      const z = placement.z || 0;
      const y = placement.y;
      if(wall === 'back'){
        frame.position.set(x, y, -roomDepth / 2 + .16);
        frame.rotation.y = 0;
      }else if(wall === 'left'){
        frame.position.set(-roomWidth / 2 + .16, y, z);
        frame.rotation.y = -Math.PI / 2;
      }else{
        frame.position.set(roomWidth / 2 - .16, y, z);
        frame.rotation.y = Math.PI / 2;
      }
      frame.castShadow = true;
      group.add(frame);

      const tex = textureLoader.load(
        item.src,
        undefined,
        undefined,
        (error) => {
          console.error(`Failed to load texture for ${item.id}:`, item.src, error);
        }
      );
      tex.colorSpace = THREE.SRGBColorSpace;
      const art = new THREE.Mesh(
        new THREE.PlaneGeometry(artW, artH),
        new THREE.MeshBasicMaterial({map:tex, side:THREE.DoubleSide, color:0xffffff})
      );
      if(wall === 'back'){
        art.position.set(x, y, -roomDepth / 2 + .22);
        art.rotation.y = 0;
      }else if(wall === 'left'){
        art.position.set(-roomWidth / 2 + .22, y, z);
        art.rotation.y = -Math.PI / 2;
      }else{
        art.position.set(roomWidth / 2 - .22, y, z);
        art.rotation.y = Math.PI / 2;
      }
      art.userData.artwork = item;
      interactive.push(art);
      group.add(art);
    });

    const cameraPosition = group.localToWorld(new THREE.Vector3(0, 2.3, roomDepth / 2 + 2.1));
    const cameraLookAt = group.localToWorld(new THREE.Vector3(0, 2.45, roomDepth / 2 - .72));
    state.cameraTargets.set(room.id, {position:cameraPosition, lookAt:cameraLookAt});
  }

  addLobby();
  addSunkenRuins();
  state.rooms.forEach((room, index) => addRoom(room, index, state.rooms.length));

  const glintCount = reducedMotion ? 42 : 120;
  const glintPositions = new Float32Array(glintCount * 3);
  for(let i = 0; i < glintCount; i++){
    glintPositions[i * 3] = (Math.random() - .5) * 24;
    glintPositions[i * 3 + 1] = 1 + Math.random() * 4.1;
    glintPositions[i * 3 + 2] = (Math.random() - .5) * 24;
  }
  const glintGeometry = new THREE.BufferGeometry();
  glintGeometry.setAttribute('position', new THREE.BufferAttribute(glintPositions, 3));
  const glints = new THREE.Points(glintGeometry, new THREE.PointsMaterial({color:0xffe29a, size:.035, transparent:true, opacity:.68}));
  scene.add(glints);
  const chipField = addGoldDustField();

  const raycaster = new THREE.Raycaster();
  const pointer = new THREE.Vector2();
  const keys = new Set();
  let yaw = 0;
  let pitch = 0;
  let dragging = false;
  let pointerStart = null;
  let lastPointer = null;

  function applyCamera(){
    camera.rotation.set(pitch, yaw, 0);
  }

  function lookAt(target){
    const dir = new THREE.Vector3().subVectors(target, camera.position).normalize();
    yaw = Math.atan2(-dir.x, -dir.z);
    pitch = Math.asin(Math.max(-.72, Math.min(.72, dir.y)));
    applyCamera();
  }

  function canWalk(candidate){
    for(const room of collisionRooms){
      const local = room.group.worldToLocal(candidate.clone());
      const halfWidth = room.width / 2;
      const halfDepth = room.depth / 2;
      const nearShell = Math.abs(local.x) < halfWidth + .34 && Math.abs(local.z) < halfDepth + .34;
      if(!nearShell) continue;
      const inRoomDepth = local.z > -halfDepth + .18 && local.z < halfDepth - .18;
      const nearSideWall = Math.abs(local.x) > halfWidth - .24 && inRoomDepth;
      const nearBackWall = local.z < -halfDepth + .24 && Math.abs(local.x) < halfWidth;
      const nearFrontWall = local.z > halfDepth - .24 && Math.abs(local.x) > room.doorwayWidth / 2;
      if(nearSideWall || nearBackWall || nearFrontWall) return false;
    }
    return true;
  }

  function focusRoom(roomId){
    const target = state.cameraTargets.get(roomId);
    if(!target) return;
    camera.position.copy(target.position);
    lookAt(target.lookAt);
    state.currentRoom = roomId;
    const room = state.rooms.find(room => room.id === roomId);
    document.getElementById('currentPlace').textContent = room ? room.label : roomId;
    document.querySelectorAll('.room-jump button').forEach(button => {
      button.classList.toggle('is-active', button.dataset.room === roomId);
    });
  }

  function focusLobby(){
    camera.position.set(0, 2.45, .85);
    lookAt(new THREE.Vector3(0, 2.2, 9.55));
    state.currentRoom = 'lobby';
    document.getElementById('currentPlace').textContent = '中央中庭';
    document.querySelectorAll('.room-jump button').forEach(button => button.classList.remove('is-active'));
  }
  window.focusGalleryRoom = focusRoom;
  window.focusGalleryLobby = focusLobby;

  mount.addEventListener('pointerdown', event => {
    dragging = true;
    pointerStart = {x:event.clientX, y:event.clientY};
    lastPointer = {x:event.clientX, y:event.clientY};
    mount.setPointerCapture(event.pointerId);
  });

  mount.addEventListener('pointermove', event => {
    if(!dragging || !lastPointer) return;
    const dx = event.clientX - lastPointer.x;
    const dy = event.clientY - lastPointer.y;
    yaw -= dx * .003;
    pitch -= dy * .0024;
    pitch = Math.max(-.72, Math.min(.72, pitch));
    lastPointer = {x:event.clientX, y:event.clientY};
    applyCamera();
  });

  mount.addEventListener('pointerup', event => {
    dragging = false;
    const moved = pointerStart ? Math.hypot(event.clientX - pointerStart.x, event.clientY - pointerStart.y) : 999;
    pointerStart = null;
    lastPointer = null;
    if(moved > 7) return;
    const rect = renderer.domElement.getBoundingClientRect();
    pointer.x = ((event.clientX - rect.left) / rect.width) * 2 - 1;
    pointer.y = -((event.clientY - rect.top) / rect.height) * 2 + 1;
    raycaster.setFromCamera(pointer, camera);
    const hit = raycaster.intersectObjects(interactive, true)[0];
    if(hit && hit.object.userData.artwork) openDetail(hit.object.userData.artwork, featured);
  });

  window.addEventListener('keydown', event => {
    if(['KeyW','KeyA','KeyS','KeyD'].includes(event.code)) keys.add(event.code);
  });

  window.addEventListener('keyup', event => {
    keys.delete(event.code);
  });

  function animate(){
    requestAnimationFrame(animate);
    const speed = keys.has('ShiftLeft') || keys.has('ShiftRight') ? .13 : .075;
    const forward = new THREE.Vector3(0, 0, -1).applyQuaternion(camera.quaternion);
    forward.y = 0;
    forward.normalize();
    const right = new THREE.Vector3(1, 0, 0).applyQuaternion(camera.quaternion);
    right.y = 0;
    right.normalize();
    const movement = new THREE.Vector3();
    if(keys.has('KeyW')) movement.addScaledVector(forward, speed);
    if(keys.has('KeyS')) movement.addScaledVector(forward, -speed);
    if(keys.has('KeyA')) movement.addScaledVector(right, -speed);
    if(keys.has('KeyD')) movement.addScaledVector(right, speed);
    const nextPosition = camera.position.clone().add(movement);
    if(canWalk(nextPosition)) camera.position.copy(nextPosition);
    camera.position.x = Math.max(-16.2, Math.min(16.2, camera.position.x));
    camera.position.z = Math.max(-16.2, Math.min(16.2, camera.position.z));
    if(!reducedMotion) glints.rotation.y += .0009;
    if(!reducedMotion && caustics.material.map){
      const now = performance.now() * .000025;
      caustics.material.map.offset.set(now % 1, (now * .62) % 1);
      caustics.material.opacity = .11 + Math.sin(performance.now() * .0007) * .025;
    }
    if(chipField && chipField.userData.chips){
      chipField.userData.chips.forEach(sprite => {
        sprite.position.y += Math.sin(performance.now() * sprite.userData.speed + sprite.userData.phase) * .0008;
        sprite.material.rotation += .002;
      });
    }
    renderer.render(scene, camera);
  }

  const resize = () => {
    if(!mount.clientWidth || !mount.clientHeight) return;
    camera.aspect = mount.clientWidth / mount.clientHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(mount.clientWidth, mount.clientHeight);
  };
  window.addEventListener('resize', resize);
  applyCamera();
  animate();
  focusLobby();
  state.three = {THREE, renderer, scene, camera};
}

function focusRoom(roomId){
  if(window.focusGalleryRoom){
    window.focusGalleryRoom(roomId);
  }
  setFilter(roomId);
}

function focusLobby(){
  if(window.focusGalleryLobby) window.focusGalleryLobby();
  state.currentRoom = 'lobby';
  document.getElementById('currentPlace').textContent = 'Central Atrium';
  renderControls();
}

document.getElementById('lobbyButton').addEventListener('click', focusLobby);
document.getElementById('archiveLink').addEventListener('click', () => {
  document.getElementById('catalog').scrollIntoView({behavior:reducedMotion ? 'auto' : 'smooth'});
});
document.getElementById('guideButton').addEventListener('click', () => {
  const copy = document.querySelector('.hud-copy');
  copy.textContent = '行走：WASD 键，加速按 Shift。视角：拖动鼠标。查看作品：点击画框。切换展厅：右侧快速跳转。';
});

async function boot(){
  try{
    const response = await fetch(DATA_URL);
    if(!response.ok) throw new Error(`HTTP ${response.status}`);
    state.artworks = await response.json();
    const layoutResponse = await fetch(LAYOUT_URL);
    if(layoutResponse.ok) state.layouts = await layoutResponse.json();
  }catch(error){
    showFallback('作品数据加载失败，请刷新页面重试。');
    return;
  }
  state.rooms = uniqueRooms(state.artworks);
  const totalCount = document.getElementById('totalCount');
  const featuredCount = document.getElementById('featuredCount');
  if(totalCount) totalCount.textContent = String(state.artworks.length);
  if(featuredCount) featuredCount.textContent = String(state.artworks.filter(item => item.featured).length);
  renderControls();
  renderCatalog();
  initThreeGallery();
}

boot();
</script>
</body>
</html>
